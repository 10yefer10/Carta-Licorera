<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licorera R&A — Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0d0c0a;
    --charcoal:#1a1815;
    --charcoal-2:#231f1a;
    --cream:#efe6d3;
    --cream-dim:#b7ad98;
    --amber:#e2900f;
    --amber-deep:#a8590c;
    --wheat:#b6913f;
    --line: rgba(239,230,211,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(226,144,15,0.08), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 6px);
    color:var(--cream);
    font-family:'Barlow Condensed', sans-serif;
    min-height:100vh;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:38px 20px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, transparent 60%, var(--black) 100%),
      radial-gradient(circle at 50% -10%, rgba(226,144,15,0.16), transparent 55%);
    pointer-events:none;
  }
  .logo-wrap{
    width:128px; height:128px;
    margin:0 auto 14px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--amber);
    box-shadow:0 0 0 6px var(--charcoal-2), 0 8px 24px rgba(0,0,0,0.55);
    position:relative;
    z-index:1;
  }
  .logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand{
    font-family:'Anton', sans-serif;
    font-size:clamp(30px,9vw,44px);
    letter-spacing:1px;
    color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,0.4);
    margin:0;
    position:relative; z-index:1;
    line-height:1;
  }
  .brand span{color:var(--amber);}
  .tagline{
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--wheat);
    margin-top:8px;
    font-weight:600;
    position:relative; z-index:1;
  }
  .cap-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:16px; position:relative; z-index:1;
  }
  .cap-row .dash{width:34px;height:1px;background:var(--line);}
  .cap-row .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);}

  /* ---------- NAV (category chips) ---------- */
  .nav{
    position:sticky; top:0; z-index:20;
    display:flex; gap:8px; overflow-x:auto;
    padding:12px 14px;
    background:rgba(13,12,10,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    flex:0 0 auto;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--cream-dim);
    background:var(--charcoal);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  .nav button.active{
    color:var(--black);
    background:var(--amber);
    border-color:var(--amber);
  }

  /* ---------- CATEGORY SECTIONS ---------- */
  .menu{max-width:640px; margin:0 auto; padding:6px 0 60px;}
  .category{border-bottom:1px solid var(--line);}
  .cat-head{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:18px 18px;
    background:none; border:none;
    cursor:pointer;
    text-align:left;
  }
  .cat-head-left{display:flex; align-items:center; gap:12px;}
  .cat-icon{
    width:34px;height:34px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--amber-deep);
    border-radius:50%;
    color:var(--amber);
    font-size:16px;
    flex:0 0 auto;
  }
  .cat-title{
    font-family:'Anton', sans-serif;
    font-size:20px;
    letter-spacing:0.5px;
    color:var(--cream);
  }
  .cat-count{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    display:block;
    margin-top:2px;
    letter-spacing:0.5px;
  }
  .chevron{
    color:var(--wheat);
    transition:transform 0.25s ease;
    font-size:14px;
  }
  .category.open .chevron{transform:rotate(180deg);}

  .items{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.35s ease;
    padding:0 18px;
  }
  .category.open .items{padding-bottom:10px;}

  .item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 0;
    border-top:1px dashed rgba(239,230,211,0.10);
  }
  .item:first-child{border-top:none;}
  .item-name{
    font-size:16.5px;
    font-weight:500;
    color:var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-leader{
    flex:1;
    border-bottom:1px dotted rgba(239,230,211,0.28);
    transform:translateY(-4px);
    min-width:14px;
  }
  .item-price{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:700;
    color:var(--amber);
    white-space:nowrap;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:26px 20px 40px;
    color:var(--cream-dim);
    font-size:12px;
    letter-spacing:1px;
  }
  footer .wheat-rule{
    width:60px;height:1px;
    background:var(--wheat);
    margin:0 auto 14px;
    opacity:0.5;
  }
  footer .note{margin-top:6px; opacity:0.7;}

  @media (min-width:680px){
    .menu{padding-top:10px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="logo-wrap"><img src="logo.jpg" alt="Licorera R&A"></div>
  <h1 class="brand">LICORERA <span>R&A</span></h1>
  <div class="tagline">Carta de productos</div>
  <div class="cap-row"><div class="dash"></div><div class="dot"></div><div class="dash"></div></div>
</div>

<nav class="nav" id="nav"></nav>

<main class="menu" id="menu"></main>

<footer>
  <div class="wheat-rule"></div>
  Precios sujetos a cambio sin previo aviso.
  <div class="note">Venta de licor solo a mayores de 18 años · Consúmelo con moderación</div>
</footer>

<script>
const data = [
  { cat:"Whisky", icon:"W", items:[
    ["Old Par 12 Años 750 ml", 160000],
    ["Buchanans Deluxe 12 Años 750 ml", 176000],
    ["Buchanans Master 750 ml", 195000],
    ["Chivas 12 Años 700 ml", 185000],
    ["Johnnie Walker Red 375 ml", 59000],
    ["Johnnie Walker Red 750 ml", 80000],
  ]},
  { cat:"Ron", icon:"R", items:[
    ["Medellín 5 Años 375 ml", 45000],
    ["Medellín 5 Años 750 ml", 70000],
    ["Medellín Dorado 750 ml", 60000],
    ["Medellín Dorado 375 ml", 40000],
    ["Ron Pink", 62000],
    ["Ron Caldas 375 ml", 45000],
  ]},
  { cat:"Aguardiente", icon:"A", items:[
    ["Aguardiente Amarillo 750 ml", 68000],
    ["Aguardiente Amarillo 375 ml", 39000],
    ["Aguardiente Amarillo Real 750 ml", 65000],
    ["Aguardiente Tapa Azul Media 375 ml", 39000],
    ["Aguardiente 260 ml (Shot)", 16000],
    ["Antioqueño Tapa Azul 750 ml", 69000],
    ["Antioqueño Tapa Verde 750 ml", 69000],
  ]},
  { cat:"Cervezas", icon:"C", items:[
    ["Club Colombia", 4000],
    ["Coronita", 5000],
    ["Budweiser Lata", 3500],
    ["3 Cordilleras Lata", 4000],
    ["Heineken Lata", 3500],
    ["Águila Original", 3000],
    ["Águila Original Lata", 3500],
    ["Águila Light", 3500],
    ["Águila Light Lata", 3500],
    ["Costeña", 3000],
    ["Costeña Lata", 3000],
    ["Bretaña", 3500],
    ["Andina Dorada Lata", 3000],
    ["Cerveza Central", 2500],
    ["Smirnoff", 9000],
  ]},
  { cat:"Bebidas y refrescos", icon:"B", items:[
    ["Gaseosa Coca-Cola 500 ml", 4000],
    ["Gaseosa Coca-Cola 1.5 L", 8000],
    ["Gaseosa Manzana 1.5 L", 6500],
    ["Gaseosa Colombiana 1.5 L", 6500],
    ["Gaseosa Seven Up 400 ml", 4000],
    ["Gaseosa Cuatro 400 ml", 4000],
    ["Gaseosa Sprite 400 ml", 4000],
    ["Ginger 400 ml", 4000],
    ["Andina Refajo Lata 310 ml", 3000],
    ["Cola y Pola Lata", 3000],
    ["Hit Tropical", 4000],
    ["Hit Mora", 4000],
    ["Hit Naranjapiña", 4000],
    ["Hit Lulo", 4000],
    ["Agua Cristal 600 ml", 2000],
    ["Agua 1 L", 3000],
    ["Bonfiest", 4000],
  ]},
  { cat:"Energizantes e hidratantes", icon:"E", items:[
    ["Speed Max", 3000],
    ["Electrolit", 9000],
    ["Gatorade", 4500],
    ["Gatorlit", 7000],
  ]},
  { cat:"Snacks y pasabocas", icon:"S", items:[
    ["Detodito BBQ", 4000],
    ["Detodito Natural", 4000],
    ["Detodito Mix", 4000],
    ["Detodito Limón", 4000],
    ["Detodito Pollo", 4000],
    ["Cheetos Picante", 3000],
    ["Cheetos Naturales", 3000],
    ["Papas de Pollo", 3000],
    ["Papas de Limón", 3000],
    ["Manimoto", 3000],
    ["Salchicha", 6000],
  ]},
  { cat:"Dulces y varios", icon:"D", items:[
    ["Trident 8.5", 2000],
    ["Bombones", 1000],
    ["Halls Barra Surtido", 2000],
    ["Menta", 100],

  ]},
  { cat:"Cigarrillos", icon:"K", items:[
    ["Rothmans (Unidad)", 1100],
    ["Lucky (Unidad)", 1100],
  ]},
   { cat:"Adicionales", icon:"V", items:[
    ["Limon", 2000],
    
  ]},
];

const fmt = n => "$" + n.toLocaleString("es-CO");

const nav = document.getElementById("nav");
const menu = document.getElementById("menu");

data.forEach((group, i) => {
  const chip = document.createElement("button");
  chip.textContent = group.cat;
  chip.dataset.target = "cat-" + i;
  nav.appendChild(chip);

  const section = document.createElement("section");
  section.className = "category";
  section.id = "cat-" + i;

  const head = document.createElement("button");
  head.className = "cat-head";
  head.innerHTML = `
    <div class="cat-head-left">
      <div class="cat-icon">${group.icon}</div>
      <div>
        <div class="cat-title">${group.cat}</div>
        <span class="cat-count">${group.items.length} productos</span>
      </div>
    </div>
    <div class="chevron">▾</div>
  `;

  const itemsWrap = document.createElement("div");
  itemsWrap.className = "items";
  group.items.forEach(([name, price]) => {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <span class="item-name">${name}</span>
      <span class="item-leader"></span>
      <span class="item-price">${fmt(price)}</span>
    `;
    itemsWrap.appendChild(row);
  });

  head.addEventListener("click", () => {
    const isOpen = section.classList.contains("open");
    document.querySelectorAll(".category").forEach(c => {
      c.classList.remove("open");
      c.querySelector(".items").style.maxHeight = null;
    });
    if (!isOpen) {
      section.classList.add("open");
      itemsWrap.style.maxHeight = itemsWrap.scrollHeight + "px";
    }
  });

  section.appendChild(head);
  section.appendChild(itemsWrap);
  menu.appendChild(section);
});

nav.addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  const target = document.getElementById(e.target.dataset.target);
  document.querySelectorAll(".category").forEach(c => {
    c.classList.remove("open");
    c.querySelector(".items").style.maxHeight = null;
  });
  target.classList.add("open");
  target.querySelector(".items").style.maxHeight = target.querySelector(".items").scrollHeight + "px";
  target.scrollIntoView({behavior:"smooth", block:"start"});
});

// abrir la primera categoría por defecto
document.querySelector(".category").classList.add("open");
document.querySelector(".category .items").style.maxHeight = document.querySelector(".category .items").scrollHeight + "px";
document.querySelector(".nav button").classList.add("active");
</script>

</body>
</html>
